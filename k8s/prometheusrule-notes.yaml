apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: notes-rules, namespace: monitoring, labels: {release: kps}}
spec:
  groups:
    - name: notes
      rules:
        - alert: NotesApiPodsUnavailable
          expr: kube_deployment_status_replicas_available{namespace="notes", deployment="api"} < 1
          for: 2m
          labels: {severity: critical}
          annotations: {summary: "No available API pods in namespace notes"}
