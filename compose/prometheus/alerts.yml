groups:
  - name: notes
    rules:
      - alert: NotesApiDown
        expr: probe_success{job="notes-api-probe"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Notes API health check failing"
          description: "{{ $labels.instance }} has returned non-2xx or timed out for 2 minutes."
      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Root filesystem below 10% free"}
